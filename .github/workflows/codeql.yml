name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'  # weekly, Monday 06:00 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kotlin/Java must be EXTRACTED FROM A REAL BUILD. build-mode "none" cannot see
          # Gradle-compiled sources, so this leg failed on every run since 2026-06-05 with
          #   "CodeQL detected code written in Java/Kotlin but could not process any of it
          #    using the 'none' build mode"
          # Run the same Gradle assemble the android-ci workflow already uses instead.
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Fetch sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6
        with:
          # A cache hit means nothing recompiles, and CodeQL only sees code that
          # is actually compiled while it is tracing. Always build cold here.
          cache-disabled: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Manual build mode: whatever is compiled between init and analyze gets extracted.
      # kotlin.compiler.execution.strategy=in-process is the load-bearing flag - by default
      # Kotlin compiles inside a separate long-lived daemon that CodeQL's tracer never sees,
      # which yields "CodeQL could not process any code written in Java/Kotlin" even though
      # the build succeeds. The --no-*-cache flags stop Gradle short-circuiting compilation.
      - name: Build Android app for CodeQL extraction
        if: matrix.language == 'java-kotlin'
        working-directory: android/agent-bill
        run: |
          bash ./gradlew assembleDebug \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --rerun-tasks \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
